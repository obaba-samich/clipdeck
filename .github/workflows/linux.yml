name: Linux download

# Builds the tester download: the repo plus the built web app and tray icons, so
# installing doesn't need Node. Published as the release "linux-latest".
on:
  push:
    branches: [main]
    paths-ignore: ["ios/**", ".github/workflows/ios.yml", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app and icons
        working-directory: web
        run: npm ci && npm run build

      - name: Python sanity check
        run: python3 -m py_compile clipdeck/*.py

      - name: Package
        run: |
          git archive --format=tar --prefix=clipdeck/ -o clipdeck-linux.tar HEAD -- . ':!ios' ':!.github'
          tar --append -f clipdeck-linux.tar --transform 's,^,clipdeck/,' clipdeck/static clipdeck/assets
          gzip -9 clipdeck-linux.tar
          tar -tzf clipdeck-linux.tar.gz | grep -q 'clipdeck/clipdeck/static/index.html'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete linux-latest --yes --cleanup-tag || true
          gh release create linux-latest clipdeck-linux.tar.gz --title "Clipdeck for Linux (test build ${GITHUB_RUN_NUMBER})" \
            --notes "Unpack it, then run ./install.sh inside the clipdeck folder. See the README for what it needs."
