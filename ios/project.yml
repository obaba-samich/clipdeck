name: Clipdeck
options:
  bundleIdPrefix: com.pizza
  deploymentTarget:
    iOS: "17.0"
targets:
  Clipdeck:
    type: application
    platform: iOS
    sources: [Clipdeck]
    info:
      path: Clipdeck/Info.plist
      properties:
        CFBundleDisplayName: Clipdeck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBG
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The PC serves plain http on the LAN / Tailscale.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Clipdeck connects to your PC on your Wi-Fi to show your clips.
        NSCameraUsageDescription: Scan the QR code on your PC to connect, or film a video to import.
        # Picking "Take Video" when importing records sound; without this iOS kills the app.
        NSMicrophoneUsageDescription: Record sound when you film a video to import.
        NSPhotoLibraryAddUsageDescription: Save clips to your Photos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pizza.clipdeck
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_PREVIEWS: NO
